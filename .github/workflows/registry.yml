name: Control plane

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Registry sync + work-item schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Regenerates registry/*.json from manifests and fails if the committed
      # files drift from what the harvester produces.
      - name: Registries in sync with manifests
        run: bun run registry:check
      # Validates every work/*.md against the work-item schema.
      - name: Work items valid
        run: bun run work:check
